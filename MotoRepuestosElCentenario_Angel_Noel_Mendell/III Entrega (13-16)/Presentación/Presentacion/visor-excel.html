                btn.className = `tab-btn ${idx === currentSheetIdx ? 'active' : ''}`;
                btn.innerHTML = `<i data-lucide="sheet" class="w-3.5 h-3.5 opacity-70"></i> <span>${idx + 1}. ${sheet.name}</span>`;
                btn.onclick = () => switchSheet(idx);
                bar.appendChild(btn);
            });
        }

        function colIndexToLetters(idx) {
            let res = '';
            idx += 1;
            while (idx > 0) {
                let rem = (idx - 1) % 26;
                res = String.fromCharCode(65 + rem) + res;
                idx = Math.floor((idx - 1) / 26);
            }
            return res;
        }

        function lettersToColIndex(letters) {
            let num = 0;
            for (let i = 0; i < letters.length; i++) {
                num = num * 26 + (letters.charCodeAt(i) - 65 + 1);
            }
            return num - 1;
        }

        function switchSheet(idx) {
            currentSheetIdx = idx;
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', i === idx);
            });

            const sheet = workbookData[idx];
            document.getElementById('sheetStats').innerText = `Hoja: ${sheet.name} · ${sheet.max_row} Filas · ${sheet.max_col + 1} Columnas`;

            // Procesar combinaciones de celdas (mergeCells)
            const mergeMap = {}; // ref -> { colspan, rowspan }
            const skipCells = new Set(); // celdas secundarias dentro de un rango
            
            (sheet.merges || []).forEach(m => {
                const parts = m.split(':');
                if (parts.length === 2) {
                    const startRef = parts[0];
                    const endRef = parts[1];
                    const startColLet = startRef.replace(/[0-9]/g, '');
                    const startRow = parseInt(startRef.replace(/[A-Z]/g, ''));
                    const endColLet = endRef.replace(/[0-9]/g, '');
                    const endRow = parseInt(endRef.replace(/[A-Z]/g, ''));

                    const startColIdx = lettersToColIndex(startColLet);
                    const endColIdx = lettersToColIndex(endColLet);

                    const colspan = endColIdx - startColIdx + 1;
                    const rowspan = endRow - startRow + 1;

                    mergeMap[`${startRow}_${startColIdx}`] = { colspan, rowspan };

                    for (let r = startRow; r <= endRow; r++) {
                        for (let c = startColIdx; c <= endColIdx; c++) {
                            if (r !== startRow || c !== startColIdx) {
                                skipCells.add(`${r}_${c}`);
                            }
                        }
                    }
                }
            });

            // Generar tabla HTML
            let html = '<thead><tr><th class="corner-cell">◢</th>';
            for (let c = 0; c <= sheet.max_col; c++) {
                html += `<th>${colIndexToLetters(c)}</th>`;
            }
            html += '</tr></thead><tbody>';

            for (let r = 1; r <= sheet.max_row; r++) {
                html += `<tr><td class="row-header">${r}</td>`;
                for (let c = 0; c <= sheet.max_col; c++) {
                    const key = `${r}_${c}`;
                    if (skipCells.has(key)) continue;

                    const cell = sheet.grid[key];
                    const merge = mergeMap[key];
                    const colspanAttr = merge && merge.colspan > 1 ? ` colspan="${merge.colspan}"` : '';
                    const rowspanAttr = merge && merge.rowspan > 1 ? ` rowspan="${merge.rowspan}"` : '';

                    const displayVal = cell ? (cell.d ?? '') : '';
                    const formula = cell && cell.f ? cell.f : '';
                    const cellRef = `${colIndexToLetters(c)}${r}`;

                    // Alineación y estilo inteligente
                    let alignClass = 'text-left';
                    let textClass = 'text-slate-300';
                    let fontClass = '';

                    const isUsd = displayVal.startsWith('$') || displayVal.startsWith('-$');
                    const isNio = displayVal.startsWith('C$') || displayVal.startsWith('-C$');
                    if (isUsd || isNio || displayVal.endsWith('%')) {
                        alignClass = 'text-right';
                        textClass = isUsd ? 'text-emerald-400 font-mono' : (isNio ? 'text-cyan-400 font-mono' : 'text-purple-300 font-mono');
                    } else if (!isNaN(displayVal.replace(/,/g, '')) && displayVal.trim() !== '') {
                        alignClass = 'text-right font-mono';
                    } else if (r <= 2 || displayVal.toLowerCase().includes('resumen') || displayVal.toLowerCase().includes('total') || displayVal.toLowerCase().includes('van') || displayVal.toLowerCase().includes('tir')) {
                        fontClass = 'font-bold text-white';
                    }

                    const dataFormula = formula ? ` data-formula="=${formula.replace(/"/g, '&quot;')}"` : '';
                    const escapedDisplayVal = displayVal
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                    const dataVal = escapedDisplayVal.replace(/"/g, '&quot;');

                    html += `<td class="cell ${alignClass} ${textClass} ${fontClass}" data-ref="${cellRef}" data-val="${dataVal}"${dataFormula}${colspanAttr}${rowspanAttr} onclick="selectCell(this)">${escapedDisplayVal}</td>`;
                }
                html += '</tr>';
            }
            html += '</tbody>';

            document.getElementById('excelTable').innerHTML = html;
            
            // Seleccionar por defecto la primera celda disponible
            const firstCell = document.querySelector('td.cell');
            if (firstCell) selectCell(firstCell);

            try { lucide.createIcons(); } catch (e) {}
        }

        function selectCell(td) {
            document.querySelectorAll('td.cell.selected').forEach(el => el.classList.remove('selected'));
            td.classList.add('selected');
            const ref = td.getAttribute('data-ref') || 'A1';
            const val = td.getAttribute('data-val') || '';
            const formula = td.getAttribute('data-formula') || '';

            document.getElementById('activeCellRef').innerText = ref;
            document.getElementById('activeCellVal').innerText = formula ? `${formula}  [Valor: ${val}]` : (val || '(celda vacía)');
        }

        function handleSearch(query) {
            const q = query.trim().toLowerCase();
            document.querySelectorAll('td.cell').forEach(td => {
                td.classList.remove('highlight-search');
                if (q && td.innerText.toLowerCase().includes(q)) {
                    td.classList.add('highlight-search');
                }
            });
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen().catch(err => console.log(err));
            }
        }

        window.onload = initViewer;
    </script>
</body>
</html>
